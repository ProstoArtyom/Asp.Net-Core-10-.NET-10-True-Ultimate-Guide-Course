ntroller(s) with attribute routing.</p></li><li><p>Use essential route parameters and route constraints.</p></li><li><p>Use parameter validation when necessary.</p></li><li><p>Return ContentResult, JsonResult, FileResult and other status code results when necessary.</p></li><li><p>Return the appropriate HTTP response status code, based on above examples.</p></li></ul><p><br></p>","asset":null,"display_type":"text"}]},"solution_res":{"count":0,"next":null,"previous":null,"results":[]},"instructor_example_res":{"count":1,"next":null,"previous":null,"results":[{"_class":"practice_question","id":502708,"body":"<p>Check your source code with Instructor's source code.</p>","answer":"<p>Full source code at <a href=\"https://github.com/Harsha-Global/AspNetCore-Harsha/tree/main/Assignment%20Solutions/04.%20Section%206%20-%20Controllers%20-%20Bank%20app%20using%20Controllers\" rel=\"noopener noreferrer\" target=\"_blank\">Github</a></p>"}]}};
