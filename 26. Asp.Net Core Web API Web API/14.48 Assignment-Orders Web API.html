    <script>
      classInfo = {"first_res":{"_class":"practice","id":1482746,"is_free":false,"description":"In this assignment, you will be developing a complex ASP.NET Core 6 /7 Web API application. The goal of this assignment is to demonstrate your understanding of various concepts and features of ASP.NET Core Web API, including controllers, a custom controller base class and EF Core etc.","estimated_duration":20,"num_submissions":44},"instruction_res":{"count":1,"next":null,"previous":null,"results":[{"_class":"practice_component","id":457494,"body":"<p>Requirements:</p><ol><li><p><strong>Project Setup: </strong></p><ol><li><p>Create a new ASP.NET Core (version 6 / 7) Web API project. </p></li><li><p>Configure the project to use the latest version of Entity Framework Core.</p></li></ol></li><li><p><strong>Web API Controllers: </strong></p><ol><li><p>Create a set of Web API controllers to handle CRUD operations for at least two entities (as mentioned below) in your application. </p></li><li><p>Implement appropriate HTTP methods (GET, POST, PUT, DELETE) for each controller. </p></li><li><p>Ensure that the controllers return appropriate HTTP status codes and responses.</p></li></ol></li><li><p><strong>Custom Controller Base Class: </strong></p><ol><li><p>Create a custom base class for your Web API controllers that includes common functionality or behavior shared across multiple controllers. </p></li><li><p>Implement exception handling and logging logic in the base class to handle common errors and provide meaningful error responses.</p></li></ol></li><li><p><strong>ProblemDetails Class: </strong></p><ol><li><p>Utilize the ProblemDetails class from the Microsoft.AspNetCore.Mvc namespace to handle and return structured error responses. </p></li><li><p>Implement custom error responses for various scenarios such as validation errors, resource not found, and server-side errors.</p></li></ol></li><li><p><strong>Entity Framework Core Integration: </strong></p><ol><li><p>Set up the database context and configure Entity Framework Core to work with your chosen database provider (e.g., SQL Server, SQLite, etc.). </p></li><li><p>Create the necessary entity classes to represent your application's data model. </p></li><li><p>Implement migrations and seed the database with initial data using Entity Framework Core. d. Use Entity Framework Core to perform database operations (CRUD) within your Web API controllers.</p></li></ol></li><li><p><strong>Testing and Documentation: </strong></p><ol><li><p>Write unit tests to validate the functionality of your Web API controllers and any other critical components. </p></li><li><p>Document the API endpoints, request/response formats, and any additional notes that might be useful for developers who will be consuming your API.</p></li></ol></li><li><p><strong>Best Practices and Security: </strong></p><ol><li><p>Apply best practices for secure API development, such as validating input data and handling sensitive information securely. </p></li><li><p>Ensure that your API is well-structured, follows RESTful principles, and uses appropriate naming conventions.</p></li></ol></li></ol><p><br></p><p><strong>Deliverables:</strong></p><ol><li><p>Complete source code of your ASP.NET Core Web API application.</p></li><li><p>Documentation describing the API endpoints, request/response formats, and any additional notes.</p></li><li><p>Unit tests for critical components.</p></li><li><p>Deployment instructions or scripts.</p></li></ol><p><br></p><p><strong>Tables/Models: </strong></p><ol><li><p>Create an entity model called \"<strong>Order</strong>\" with the following properties:</p><ul><li><p>OrderId: A unique identifier for the order. (Primary Key)</p></li><li><p>OrderNumber: A system-generated order number for easy identification.</p><ul><li><p>Auto-Generation Rule: The OrderNumber should be auto-generated using a sequential number or any desired pattern. e.g: Order_2024_1, Order_2024_2, Order_2024_3 etc. The year should be automatically generated as current year.</p></li></ul></li><li><p>CustomerName: The name of the customer who placed the order.</p><ul><li><p>Validation Rule: Required field, maximum length of 50 characters.</p></li></ul></li><li><p>OrderDate: The date when the order was placed.</p><ul><li><p>Validation Rule: Required field.</p></li></ul></li><li><p>TotalAmount: The total amount of the order.</p><ul><li><p>Validation Rule: Must be a positive number.</p></li></ul></li></ul></li><li><p>Create an entity model called \"<strong>OrderItem</strong>\" with the following properties:</p><ul><li><p>OrderItemId: A unique identifier for the order item. (Primary Key)</p></li><li><p>OrderId: The identifier of the order to which the item belongs. (Foreign Key to Order table)</p><ul><li><p>Validation Rule: Required field.</p></li></ul></li><li><p>ProductName: The name of the product in the order item.</p><ul><li><p>Validation Rule: Required field, maximum length of 50 characters.</p></li></ul></li><li><p>Quantity: The quantity of the product in the order item.</p><ul><li><p>Validation Rule: Must be a positive number.</p></li></ul></li><li><p>UnitPrice: The unit price of the product in the order item.</p><ul><li><p>Validation Rule: Must be a positive number.</p></li></ul></li><li><p>TotalPrice: The total price of the order item (Quantity * UnitPrice).</p><ul><li><p>Auto-Generation Rule: The TotalPrice should be calculated automatically based on the Quantity and UnitPrice.</p></li></ul></li></ul></li></ol><p><br></p><p>In this example, the Order table represents customer orders, and the OrderItem table represents the individual items within each order. Each OrderItem has a foreign key (OrderId) that references the Order it belongs to.</p><p><br></p><p><br></p><p><strong>API Endpoint Requirement Specification:</strong></p><ol><li><p>Retrieve all orders</p><ul><li><p>HTTP Method: GET</p></li><li><p>Endpoint: /api/orders</p></li><li><p>Response:</p><ul><li><p>Status Code: 200 OK</p></li><li><p>Body: List of OrderResponse objects representing all orders</p></li></ul></li><li><p>Description: Retrieves a list of all orders.</p></li></ul></li><li><p>Retrieve an order by ID</p><ul><li><p>HTTP Method: GET</p></li><li><p>Endpoint: /api/orders/{id}</p></li><li><p>Parameters:</p><ul><li><p>id: The ID of the order to retrieve</p></li></ul></li><li><p>Response:</p><ul><li><p>Status Code: 200 OK</p></li><li><p>Body: OrderResponse object representing the retrieved order</p></li><li><p>Status Code: 404 Not Found (if order with the given ID does not exist)</p></li></ul></li><li><p>Description: Retrieves an order by its ID.</p></li></ul></li><li><p>Add a new order</p><ul><li><p>HTTP Method: POST</p></li><li><p>Endpoint: /api/orders</p></li><li><p>Request Body: OrderAddRequest object containing the order details</p></li><li><p>Response:</p><ul><li><p>Status Code: 201 Created</p></li><li><p>Body: OrderResponse object representing the added order</p></li></ul></li><li><p>Description: Adds a new order.</p></li></ul></li><li><p>Update an existing order</p><ul><li><p>HTTP Method: PUT</p></li><li><p>Endpoint: /api/orders/{id}</p></li><li><p>Parameters:</p><ul><li><p>id: The ID of the order to update</p></li></ul></li><li><p>Request Body: OrderUpdateRequest object containing the updated order details</p></li><li><p>Response:</p><ul><li><p>Status Code: 200 OK</p></li><li><p>Body: OrderResponse object representing the updated order</p></li><li><p>Status Code: 400 Bad Request (if the ID in the request body does not match the route parameter)</p></li></ul></li><li><p>Description: Updates an existing order.</p></li></ul></li><li><p>Delete an order</p><ul><li><p>HTTP Method: DELETE</p></li><li><p>Endpoint: /api/orders/{id}</p></li><li><p>Parameters:</p><ul><li><p>id: The ID of the order to delete</p></li></ul></li><li><p>Response:</p><ul><li><p>Status Code: 204 No Content (if deletion is successful)</p></li><li><p>Status Code: 404 Not Found (if order with the given ID does not exist)</p></li></ul></li><li><p>Description: Deletes an order by its ID.</p></li></ul></li><li><p>Retrieve all order items for a specific order</p><ul><li><p>HTTP Method: GET</p></li><li><p>Endpoint: /api/orders/{orderId}/items</p></li><li><p>Parameters:</p><ul><li><p>orderId: The ID of the order</p></li></ul></li><li><p>Response:</p><ul><li><p>Status Code: 200 OK</p></li><li><p>Body: List of OrderItemResponse objects representing all order items for the specified order</p></li></ul></li><li><p>Description: Retrieves all order items for a specific order.</p></li></ul></li><li><p>Retrieve an order item by ID</p><ul><li><p>HTTP Method: GET</p></li><li><p>Endpoint: /api/orders/{orderId}/items/{id}</p></li><li><p>Parameters:</p><ul><li><p>orderId: The ID of the order</p></li><li><p>id: The ID of the order item</p></li></ul></li><li><p>Response:</p><ul><li><p>Status Code: 200 OK</p></li><li><p>Body: OrderItemResponse object representing the retrieved order item</p></li><li><p>Status Code: 404 Not Found (if order item with the given ID does not exist)</p></li></ul></li><li><p>Description: Retrieves an order item by its ID.</p></li></ul></li><li><p>Add a new order item</p><ul><li><p>HTTP Method: POST</p></li><li><p>Endpoint: /api/orders/{orderId}/items</p></li><li><p>Parameters:</p><ul><li><p>orderId: The ID of the order</p></li></ul></li><li><p>Request Body: OrderItemAddRequest object containing the order item details</p></li><li><p>Response:</p><ul><li><p>Status Code: 201 Created</p></li><li><p>Body: OrderItemResponse object representing the added order item</p></li></ul></li><li><p>Description: Adds a new order item to the specified order.</p></li></ul></li><li><p>Update an existing order item</p><ul><li><p>HTTP Method: PUT</p></li><li><p>Endpoint: /api/orders/{orderId}/items/{id}</p></li><li><p>Parameters:</p><ul><li><p>orderId: The ID of the order</p></li><li><p>id: The ID of the order item</p></li></ul></li><li><p>Request Body: OrderItemUpdateRequest object containing the
