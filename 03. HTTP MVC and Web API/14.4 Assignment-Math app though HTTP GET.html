    <script>
      classInfo = {"first_res":{"_class":"practice","id":1413428,"is_free":false,"description":"Requirement: Create an Asp.Net Core Web Application that receives HTTP GET request (from Postman).","estimated_duration":10,"num_submissions":873},"instruction_res":{"count":1,"next":null,"previous":null,"results":[{"_class":"practice_component","id":398500,"body":"<p>It receives \"firstNumber\", \"secondNumber\" and \"operation\" as inputs as query as a part of the URL.</p><p><br></p><p><strong>Parameters:</strong></p><p>firstNumber: Any int value</p><p>secondNumber: Any int value</p><p>operation: \"+\", \"-\", \"*\", \"/\" or \"%\"</p><p>Finally, it should return the result of the specified operation performed on firstNumber and secondNumber</p><p><br></p><p><strong>Example #1:</strong></p><p>If you receive a HTTP GET request at path \"/\", if firstNumber, secondNumber and operator are submitted, it should perform the given operation and return HTTP 200 response.</p><p>Request Url: /?firstNumber=5&amp;secondNumber=2&amp;operation=add</p><p>Request Method: GET</p><p>Response Status Code: 200</p><p>Response Body (output): <code>7</code></p><p><br></p><p><br></p><p><strong>Example #2:</strong></p><p>If you receive a HTTP GET request at path \"/\", if firstNumber, secondNumber and operator are submitted, it should perform the given operation and return HTTP 200 response.</p><p>Request Url: /?firstNumber=5&amp;secondNumber=2&amp;operation=multiply</p><p>Request Method: GET</p><p>Response Status Code: 200</p><p>Response Body (output): <code>10</code></p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2023-02-20_15-53-43-2befddb2637c047f86c5514bbdf4bfae.png\"></figure><p><br></p><p><strong>Example #3:</strong></p><p>If you receive a HTTP GET request at path \"/\", if firstNumber, secondNumber and operator are submitted, if \"operation\" is incorrect, it should return HTTP 200 response.</p><p>Request Url: /?firstNumber=5&amp;secondNumber=2&amp;operation=something</p><p>Request Method: GET</p><p>Response Status Code: 400</p><p>Response Body (output): <code>Invalid input for 'operation'</code></p><p><br></p><p><br></p><p><strong>Example #4:</strong></p><p>If you receive a HTTP GET request at path \"/\", if neither firstNumber, secondNumber and operator are submitted, return HTTP 400 response.</p><p>Request Url: /</p><p>Request Method: GET</p><p>Response Status Code: 400</p><p>Response Body (output): </p><pre class=\"prettyprint linenums\">Invalid input for 'firstNumber'\nInvalid input for 'secondNumber'\nInvalid input for 'operation'</pre><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2023-02-20_15-53-43-8e1def405fd0fe8bdd00514ca68bbac5.png\"></figure><p><br></p><p><strong>Example #5:</strong></p><p>If you receive a HTTP GET request at path \"/\", if any one of firstNumber, secondNumber and operator is not submitted, it should return HTTP 400 response.</p><p>Request Url: /?firstNumber=7</p><p>Request Method: GET</p><p>Response Status Code: 400</p><p>Response Body (output): </p><pre class=\"prettyprint linenums\">Invalid input for 'secondNumber'\nInvalid input for 'operation'</pre><p><br></p><p><br></p><p><strong>Instructions:</strong></p><ul><li><p>Use app.Run() method to define code for calculation of result based on given numbers and operation</p></li><li><p>The user can only supply two numbers as \"firstNumber\" and \"secondNumber\" parameters.</p></li><li><p>The \"firstNumber\", \"secondNumber\" and \"operation\" values are mandatory</p></li><li><p>Return appropriate HTTP status codes based on above examples.</p></li><li><p>Do not create controllers or any other concept which is not yet covered, to avoid confusion.</p></li></ul><p><br></p>","asset":null,"display_type":"text"}]},"solution_res":{"count":0,"next":null,"previous":null,"results":[]},"instructor_example_res":{"count":1,"next":null,"previous":null,"results":[{"_class":"practice_question","id":502702,"body":"<p>Check your source code with Instructor's source code.</p>","answer":"<h4>Instructor's source code:</h4><p><br></p><p><strong>Program.cs</strong></p><pre class=\"prettyprint linenums\">var builder = WebApplication.CreateBuilder(args);\nvar app = builder.Build();\n\n//Terminating middleware\napp.Run(async (HttpContext context) =&gt;\n{\n if (context.Request.Method == \"GET\" &amp;&amp; context.Request.Path == \"/\")\n {\n  int firstNumber = 0, secondNumber = 0;\n  string? operation = null;\n  long? result = null;\n\n  //read 'firstNumber' if submitted in the request body\n  if (context.Request.Query.ContainsKey(\"firstNumber\"))\n  {\n   string firstNumberString = context.Request.Query[\"firstNumber\"][0];\n   if (!string.IsNullOrEmpty(firstNumberString))\n   {\n    firstNumber = Convert.ToInt32(firstNumberString);\n   }\n   else\n   {\n    context.Response.StatusCode = 400;\n    await context.Response.WriteAsync(\"Invalid input for 'firstNumber'\\n\");\n   }\n  }\n  else\n  {\n   if (context.Response.StatusCode == 200)\n    context.Response.StatusCode = 400;\n   await context.Response.WriteAsync(\"Invalid input for 'firstNumber'\\n\");\n  }\n\n  //read 'secondNumber' if submitted in the request body\n  if (context.Request.Query.ContainsKey(\"secondNumber\"))\n  {\n   string secondNumberString = context.Request.Query[\"secondNumber\"][0];\n   if (!string.IsNullOrEmpty(secondNumberString))\n   {\n    secondNumber = Convert.ToInt32(context.Request.Query[\"secondNumber\"][0]);\n   }\n   else\n   {\n    if (context.Response.StatusCode == 200)\n     context.Response.StatusCode = 400;\n    await context.Response.WriteAsync(\"Invalid input for 'secondNumber'\\n\");\n   }\n  }\n  else\n  {\n   if (context.Response.StatusCode == 200)\n    context.Response.StatusCode = 400;\n   await context.Response.WriteAsync(\"Invalid input for 'secondNumber'\\n\");\n  }\n\n  //read 'operation' if submitted in the request body\n  if (context.Request.Query.ContainsKey(\"operation\"))\n  {\n   operation = Convert.ToString(context.Request.Query[\"operation\"][0]);\n\n   //perform the calculation based on the value of \"operation\"\n   switch (operation)\n   {\n    case \"add\": result = firstNumber + secondNumber; break;\n    case \"subtract\": result = firstNumber - secondNumber; break;\n    case \"multiply\": result = firstNumber * secondNumber; break;\n    case \"divide\": result = (secondNumber != 0) ? firstNumber / secondNumber : 0; break; //avoid DivideByZeroException, if secondNuber is 0 (zero)\n    case \"mod\": result = (secondNumber != 0) ? firstNumber % secondNumber : 0; break; //avoid DivideByZeroException, if secondNuber is 0 (zero)\n   }\n\n   //If no case matched above, the \"result\" remains as 'null'\n   if (result.HasValue)\n   {\n    await context.Response.WriteAsync(result.Value.ToString());\n   }\n\n   //if invalid value is submitted for \"operation\" parameter\n   else\n   {\n    if (context.Response.StatusCode == 200)\n     context.Response.StatusCode = 400;\n    await context.Response.WriteAsync(\"Invalid input for 'operation'\\n\");\n   }\n\n  } //end of \"of ContainsKey(\"operation\")\n\n  //if the \"operation\" parameter is submitted from the client\n  else\n  {\n   if (context.Response.StatusCode == 200)\n    context.Response.StatusCode = 400;\n   await context.Response.WriteAsync(\"Invalid input for 'operation'\\n\");\n  }\n }\n});\n\napp.Run();\n\n</pre><p><br></p><p>Full source code at <a href=\"https://github.com/Harsha-Global/AspNetCore-Harsha/tree/main/Assignment%20Solutions/01.%20Section%203%20-%20HTTP%20-%20Math%20app%20through%20HTTP%20GET\" rel=\"noopener noreferrer\" target=\"_blank\">Github </a></p>"}]}};
      let instruction_download = classInfo.instruction_res.results.filter(n => n.display_type === 'download');
