    <script>
      classInfo = {"first_res":{"_class":"practice","id":1413436,"is_free":false,"description":"Create an Asp.Net Core Web Application that receives username and password via POST request (from Postman).","estimated_duration":10,"num_submissions":670},"instruction_res":{"count":1,"next":null,"previous":null,"results":[{"_class":"practice_component","id":398502,"body":"<p>Requirement: Create an Asp.Net Core Web Application that receives username and password via POST request (from Postman).</p><p>It receives \"email\" and \"password\" as query string from request body.</p><p><br></p><p><strong>Parameters:</strong></p><p>email: any email address</p><p>password: any password string</p><p>Finally, it should return message as either \"Successful login\" or \"Invalid login\".</p><p><br></p><p><strong>Process:</strong></p><p>If email is \"admin@example.com\" and password is \"admin1234\", it is treated as a valid login; otherwise invalid login.</p><p><br></p><p><strong>Example #1:</strong></p><p>If you receive a HTTP POST request at path \"/\", if the valid email and password are submitted, it should return HTTP 200 response.</p><p>Request Url: /</p><p>Request Method: POST</p><p>Request body (input): email=admin@example.com&amp;password=admin1234</p><p>Response Status Code: 200</p><p>Response body (output): </p><p><code>Successful login</code></p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-10-26_19-43-55-3767173355b8999602550da2170bb399.png\"></figure><p><br></p><p><strong>Example #2:</strong></p><p>If you receive a HTTP POST request at path \"/\", if either email or password is incorrect, it should return HTTP 400 response.</p><p>Request Url: /</p><p>Request Method: POST</p><p>Request body (input): email=manager@example.com&amp;password=manager-password</p><p>Response Status Code: 400</p><p>Response body (output):</p><p><code>Invalid login</code></p><p><br></p><p><strong>Example #3:</strong></p><p>If you receive a HTTP POST request at path \"/\", if neither email and password is submitted, it should return HTTP 400 response.</p><p>Request Url: /</p><p>Request Method: POST</p><p>Request body (input): [empty]</p><p>Response Status Code: 400</p><p>Response body (output): </p><pre class=\"prettyprint linenums\">Invalid input for 'email'\nInvalid input for 'password'</pre><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-10-26_19-43-55-9f197793c731e05adc9329ba30ad5a26.png\"></figure><p><br></p><p><strong>Example #4:</strong></p><p>If you receive a HTTP POST request at path \"/\", if password is not submitted, it should return HTTP 400 response.</p><p>Request Url: /</p><p>Request Method: POST</p><p>Request body (input): email=test@example.com</p><p>Response Status Code: 400</p><p>Response body (output): </p><p><code>Invalid input for 'password'</code></p><p><br></p><p><strong>Example #5:</strong></p><p>If you receive a HTTP POST request at path \"/\", if email not is submitted, it should return HTTP 400 response.</p><p>Request Url: /</p><p>Request Method: POST</p><p>Request body (input): password=1234</p><p>Response Status Code: 400</p><p>Response body (output): </p><p><code>Invalid input for 'password'</code></p><p><br></p><p><strong>Example #6:</strong></p><p>If you receive a HTTP GET request at path \"/\", it should return HTTP 200 response.</p><p>Request Url: /</p><p>Request Method: GET</p><p>Response Status Code: 200</p><p>Response body (output): </p><p><code>No response</code></p><p><br></p><p><br></p><p><strong>Instructions:</strong></p><ul><li><p>Use custom conventional middleware (with middleware extensions) to handle the post request at path \"/\"</p></li><li><p>The \"email\" and \"password\" values are mandatory</p></li><li><p>Return appropriate HTTP status codes based on above examples.</p></li><li><p>Do not create controllers or any other concept which is not yet covered, to avoid confusion.</p></li></ul><p><br></p>","asset":null,"display_type":"text"}]},"solution_res":{"count":0,"next":null,"previous":null,"results":[]},"instructor_example_res":{"count":1,"next":null,"previous":null,"results":[{"_class":"practice_question","id":502704,"body":"<p>Check your source code with Instructor's source code.</p>","answer":"<h4>Instructor's Source Code:</h4><p><strong>Program.cs</strong></p><pre class=\"prettyprint linenums\">using Assignment1_Middleware.CustomMiddleware;\n\nvar builder = WebApplication.CreateBuilder(args);\nvar app = builder.Build();\n\n//Invoking custom middleware\napp.UseLoginMiddleware();\n\napp.Run(async context =&gt; {\n await context.Response.WriteAsync(\"No response\");\n});\napp.Run();\n</pre><p><br></p><p><strong>CustomMiddleware\\LoginMiddleware.cs</strong></p><pre class=\"prettyprint linenums\">using Microsoft.AspNetCore.Builder;\nusing Microsoft.AspNetCore.Http;\nusing Microsoft.Extensions.Primitives;\nusing System.Threading.Tasks;\n\nnamespace Assignment1_Middleware.CustomMiddleware\n{\n // You may need to install the Microsoft.AspNetCore.Http.Abstractions package into your project\n public class LoginMiddleware\n {\n  private readonly RequestDelegate _next;\n\n  public LoginMiddleware(RequestDelegate next)\n  {\n   _next = next;\n  }\n\n  public async Task Invoke(HttpContext context)\n  {\n   if (context.Request.Path == \"/\" &amp;&amp; context.Request.Method == \"POST\")\n   {\n    //Read response body as stream\n    StreamReader reader = new StreamReader(context.Request.Body);\n    string body = await reader.ReadToEndAsync();\n\n    //Parse the request body from string into Dictionary\n    Dictionary&lt;string, StringValues&gt; queryDict = Microsoft.AspNetCore.WebUtilities.QueryHelpers.ParseQuery(body);\n\n    string? email = null, password = null;\n\n    //read 'firstNumber' if submitted in the request body\n    if (queryDict.ContainsKey(\"email\"))\n    {\n     email = Convert.ToString(queryDict[\"email\"][0]);\n    }\n    else\n    {\n     context.Response.StatusCode = 400;\n     await context.Response.WriteAsync(\"Invalid input for 'email'\\n\");\n    }\n\n    //read 'secondNumber' if submitted in the request body\n    if (queryDict.ContainsKey(\"password\"))\n    {\n     password = Convert.ToString(queryDict[\"password\"][0]);\n    }\n    else\n    {\n     if (context.Response.StatusCode == 200)\n      context.Response.StatusCode = 400;\n     await context.Response.WriteAsync(\"Invalid input for 'password'\\n\");\n    }\n\n    //if both email and password are submitted in the request\n    if (string.IsNullOrEmpty(email) == false &amp;&amp; string.IsNullOrEmpty(password) == false)\n    {\n     //valid email and password as per the requirement specification\n     string validEmail = \"admin@example.com\", validPassword = \"admin1234\";\n     bool isValidLogin;\n\n     //if email and password are valid\n     if (email == validEmail &amp;&amp; password == validPassword)\n     {\n      isValidLogin = true;\n     }\n     else\n     {\n      isValidLogin = false;\n     }\n\n     //send response\n     if (isValidLogin)\n     {\n      await context.Response.WriteAsync(\"Successful login\\n\");\n     }\n     else\n     {\n      context.Response.StatusCode = 400;\n      await context.Response.WriteAsync(\"Invalid login\\n\");\n     }\n     \n    } //end of \"if !string.IsNullOrEmpty\"\n\n    \n   } //end of \"if method == POST\"\n\n   //else, invoke subsequent middleware (if any)\n   else\n   {\n    await _next(context);\n   }\n\n  }\n }\n\n // Extension method used to add the middleware to the HTTP request pipeline.\n public static class LoginMiddlewareExtensions\n {\n  public static IApplicationBuilder UseLoginMiddleware(this IApplicationBuilder builder)\n  {\n   return builder.UseMiddleware&lt;LoginMiddleware&gt;();\n  }\n }\n}\n\n</pre><p><br></p><p>Full source code at <a href=\"https://github.com/Harsha-Global/AspNetCore-Harsha/tree/main/Assignment%20Solutions/02.%20Section%204%20-%20Middleware%20-%20Login%20using%20Middleware\" rel=\"noopener noreferrer\" target=\"_blank\">Github</a></p>"}]}};
