    <script>
      classInfo = {"first_res":{"_class":"practice","id":1417170,"is_free":false,"description":"Create an Asp.Net Core Web Application that displays stock price with live updates from \"https://finnhub.io/\".","estimated_duration":60,"num_submissions":66},"instruction_res":{"count":2,"next":null,"previous":null,"results":[{"_class":"practice_component","id":402298,"body":"","asset":{"_class":"asset","id":44833498,"asset_type":"File","title":"StyleSheet.css","created":"2022-11-13T14:30:31Z","status":1,"captions":[],"body":"","external_url":"","is_external":false,"filename":"StyleSheet.css","media_license_token":null,"media_sources":[],"course_is_drmed":false,"download_urls":{"File":[{"label":"download","file":"https://att-c.udemycdn.com/2022-11-13_14-30-31-32a97906fbafdf7c2df2b6e25b4f5d8a/original.css?response-content-disposition=attachment%3B+filename%3DStyleSheet.css&Expires=1755961365&Signature=625vLIOU85SGuiFeKsNfsMHWW9tRKQST6RxoFdQPyfCCi4J~K7YeW8WD5pj6~MjalApgdGjAPK0Fku1ngAwizSxkdkMo2Jy81XeIzasoSMWDDqTW4TcfS91YpEJ5Kis~J272rb8hj0NvE9CRT4KDxQtadj8wacIJ6d9-p1flbW3fdejfXKQPUIYZ-Ks33pKf~n15CEXuAIzJpW7Lhfj18OVjyCJrfBEVj-hrncF20ShO8LvWj-l~18MC7gYuuMHUV~ANMR-FQVJkJc-ac~uQfT1lMzFpbPUE-Qi7AGRGgfGdyfS57Ps8i6tW9r5LV81u1Yo-OLyx23F7Am9l8copsA__&Key-Pair-Id=K3MG148K9RIRF4"}]},"slide_urls":[],"slides":[],"stream_urls":null,"processing_errors":[]},"display_type":"download"},{"_class":"practice_component","id":402300,"body":"<h4>Requirement</h4><p>Create an Asp.Net Core Web Application that displays stock price with live updates from \"<strong>https://finnhub.io/</strong>\".</p><p><br></p><p><br></p><h4>UI&nbsp;Design</h4><p><strong>Trade/Index:</strong></p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-11-04_18-07-08-278c1e0afe7e85e3da14425707c3f62d.png\"></figure><p><br></p><p><strong>Trade/Orders:</strong></p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-12-20_15-23-20-314811358fe8e8e0ffadbd5d1995f4f0.png\"></figure><p><br></p><p><strong>Trade/OrdersPDF:</strong></p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-11-04_18-07-09-1f3c35620cbfb719a19aee082a878742.png\"></figure><p><br></p><p><strong>Stocks/Explore:</strong></p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-11-04_18-07-09-c42f007c1a9374cfd2407bd5e0413194.png\"></figure><p><br></p><p><strong>Stocks/Explore (after selecting a stock):</strong></p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-11-04_18-07-10-f6213b7573419319a6ea6105c95fa225.png\"></figure><p><br></p><p><br></p><h4>Architecture</h4><p>Use the n-layer (also known as n-tier)&nbsp;architecture as shown below.</p><figure><img height=\"469\" src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-11-13_08-52-24-402a4056b42fbfca2a76de0dc9c773b6.png\" width=\"865\"></figure><p><br></p><p><br></p><h4>Finnhub.io:</h4><p>https://finnhub.io is a service provider that provides live stock price information online.</p><p><br></p><h4>User-Secrets:</h4><ul><li><p>Register in \"<strong>https://finnhub.io/login</strong>\" to generate your own token [or] use the token \"<strong>cc676uaad3i9rj8tb1s0</strong>\" to make requests.</p></li><li><p>After registration at finnhub, you can find your API Key (token) at \"https://finnhub.io/dashboard\".</p></li><li><p>You need to store this token in user-secrets on your machine.</p></li><li><p>You need to attach the token as a part of request url while making requests to \"finnhub.io\".</p></li></ul><p><br></p><p><br></p><h4>appsettings:</h4><p>You will store the following configuration in appsettings.json:</p><pre class=\"prettyprint linenums\">  \"TradingOptions\":\n  {\n    \"DefaultOrderQuantity\": 100,\n    \"Top25PopularStocks\": \"AAPL,MSFT,AMZN,TSLA,GOOGL,GOOG,NVDA,BRK.B,META,UNH,JNJ,JPM,V,PG,XOM,HD,CVX,MA,BAC,ABBV,PFE,AVGO,COST,DIS,KO\"\n  },\n  \"ConnectionStrings\":\n  {\n    \"DefaultConnection\": \"Data Source=(localdb)\\\\MSSQLLocalDB;Initial Catalog=YourDatabaseHere;Integrated Security=True;Connect Timeout=30;Encrypt=False;TrustServerCertificate=False;ApplicationIntent=ReadWrite;MultiSubnetFailover=False\"\n  }</pre><p><br></p><ul><li><p>The \"DefaultOrderQuantity\" specifies default quantity to place an order in \"Trade/Index\" view.</p></li><li><p>The \"Top25PopularStocks\" represents the list of popular stocks whose prices to be shown in \"Trade/Explore\" view by default.</p></li><li><p>The \"DefaultConnection\" represents database connection details.</p></li></ul><p><br></p><p><br></p><h4>Entity model:</h4><p>You need to create two entity model classes named \"BuyOrder\" and \"SellOrder\".</p><p><br></p><p>1. Consider an entity model class called '<strong>BuyOrder</strong>' with following properties, along with corresponding validations:</p><ul><li><p>Guid BuyOrderID</p></li><li><p>string StockSymbol [Mandatory]</p></li><li><p>string StockName [Mandatory]</p></li><li><p>DateTime DateAndTimeOfOrder</p></li><li><p>uint Quantity [Value should be between 1 and 100000]</p></li><li><p>double Price [Value should be between 1 and 10000]</p></li></ul><p><br></p><p>2. Consider another entity model class called '<strong>SellOrder</strong>' with following properties, along with corresponding validations:</p><ul><li><p>Guid SellOrderID</p></li><li><p>string StockSymbol [Mandatory]</p></li><li><p>string StockName [Mandatory]</p></li><li><p>DateTime DateAndTimeOfOrder</p></li><li><p>uint Quantity [Range(1, 100000)]</p></li><li><p>double Price [Range(1, 10000)]</p></li></ul><p><br></p><p>These two entity classes are used to create list objects to store records in a service class.</p><p><br></p><p><br></p><h4>DbContext:</h4><p>You need to create a DbContext called \"<strong>StockMarketDbContext</strong>\" that connects to the database using the connection string mentioned in the appsettings.json.</p><p>It contains the following DbSets'.</p><ul><li><p>DbSet&lt;BuyOrder&gt; BuyOrders</p></li><li><p>DbSet&lt;SellOrder&gt; SellOrders</p></li></ul><p><br></p><p><br></p><h4>DTO:</h4><p>We are implementing the functionality of placing (creating) buy order and sell order.</p><p>So you need to create four DTO model classes named \"<strong>BuyOrderRequest</strong>\", \"<strong>BuyOrderResponse</strong>\", \"<strong>SellOrderRequest</strong>\", \"<strong>SellOrderResponse</strong>\".</p><p>As you can guess, the Request model classes (such as BuyOrderRequest and SellOrderRequest) are used as parameters in the service methods to receive information from controller to service class. Alternatively, the Response model classes (such as BuyOrderResponse and SellOrderResponse) are used as return type to return information back to controller, from the service.</p><p><br></p><p>1. Consider a DTO model class called '<strong>BuyOrderRequest</strong>' with following properties, along with corresponding validations:</p><ul><li><p>string StockSymbol [Mandatory]</p></li><li><p>string StockName [Mandatory]</p></li><li><p>DateTime DateAndTimeOfOrder [Should not be older than Jan 01, 2000]</p></li><li><p>uint Quantity [Value should be between 1 and 100000]</p></li><li><p>double Price [Value should be between 1 and 10000]</p></li></ul><p><br></p><p>2. Consider another DTO model class called '<strong>SellOrderRequest</strong>' with following properties, along with corresponding validations:</p><ul><li><p>string StockSymbol [Mandatory]</p></li><li><p>string StockName [Mandatory]</p></li><li><p>DateTime DateAndTimeOfOrder [Should not be older than Jan 01, 2000]</p></li><li><p>uint Quantity [Value should be between 1 and 100000]</p></li><li><p>double Price [Value should be between 1 and 10000]</p></li></ul><p><br></p><p>3. Consider another DTO model class called '<strong>BuyOrderResponse</strong>' with following properties:</p><ul><li><p>Guid BuyOrderID</p></li><li><p>string StockSymbol</p></li><li><p>string StockName</p></li><li><p>DateTime DateAndTimeOfOrder</p></li><li><p>uint Quantity</p></li><li><p>double Price</p></li><li><p>double TradeAmount</p></li></ul><p><br></p><p>4. Consider another DTO model class called '<strong>SellOrderResponse</strong>' with following properties:</p><ul><li><p>Guid SellOrderID</p></li><li><p>string StockSymbol</p></li><li><p>string StockName</p></li><li><p>DateTime DateAndTimeOfOrder</p></li><li><p>uint Quantity</p></li><li><p>double Price</p></li><li><p>double TradeAmount</p></li></ul><p><br></p><p><br></p><h4>FinnhubRepository:</h4><p><br></p><p>Create a Repository interface called '<strong>IFinnhubRepository</strong>' with following methods:</p><p>Task&lt;Dictionary&lt;string, object&gt;?&gt; GetCompanyProfile(string stockSymbol);</p><p>Task&lt;Dictionary&lt;string, object&gt;?&gt; GetStockPriceQuote(string stockSymbol);</p><p>Task&lt;List&lt;Dictionary&lt;string, string&gt;&gt;?&gt; GetStocks();</p><p>Task&lt;Dictionary&lt;string, object&gt;?&gt; SearchStocks(string stockSymbolToSearch);</p><p><br></p><p>Implement the above Repository interface called '<strong>IFinnhubRepository</strong>' that sends request to the respective url and returns its response as a Dictionary&lt;string, object&gt;.</p><p>GetCompanyProfile: https://finnhub.io/api/v1/stock/profile2?symbol={symbol}&amp;token={token}</p><p>GetStockPriceQuote: https://finnhub.io/api/v1/quote?symbol={symbol}&amp;token={token}</p><p>GetStocks: https://finnhub.io/api/v1/stock/symbol?exchange=US&amp;token={token}</p><p>SearchStocks: https://finnhub.io/api/v1/search?q={stockNameToSearch}&amp;token={token}</p><p><br></p><p>The all the repository methods such as GetCompanyProfile(), GetStockPriceQuote(), GetStocks(), SearchStocks() return the response data that was actually returned by finnhub.io/api.</p><p><br></p><p><br></p><h4>IFinnhubRepository.GetStockPriceQuote():</h4><p>The returned data from IFinnhubRepository.GetStockPriceQuote() looks like this:</p><p>{\"c\":235.87,\"d\":9.12,\"dp\":4.0221,\"h\":236.6,\"l\":226.06,\"o\":226.24,\"pc\":226.75,\"t\":1666987204}</p><p><br></p><p><strong>Response Attributes:</strong></p><p>c</p><p>Current price</p><p><br></p><p>d</p><p>Change</p><p><br></p><p>dp</p><p>Percent change</p><p><br></p><p>h</p><p>High price of the day</p><p><br></p><p>l</p><p>Low price of the day</p><p><br></p><p>o</p><p>Open price of the day</p><p><br></p><p>pc</p><p>Previous close price</p><p><br></p><p><br></p><p>Reference: https://finnhub.io/docs/api/quote</p><p><br></p><p><br></p><h4>IFinnhubRepository.GetCompanyProfile():</h4><p>The returned data from IFinnhubRepository.GetCompanyProfile() looks like this:</p><p>{\"country\":\"US\",\"currency\":\"USD\",\"exchange\":\"NASDAQ NMS - GLOBAL MARKET\",\"finnhubIndustry\":\"Technology\",\"ipo\":\"1986-03-13\",\"logo\":\"https://static2.finnhub.io/file/publicdatany/finnhubimage/stock_logo/MSFT.svg\",\"marketCapitalization\":1758286.5806001066,\"name\":\"Microsoft Corp\",\"phone\":\"14258828080.0\",\"shareOutstanding\":7454.47,\"ticker\":\"MSFT\",\"weburl\":\"https://www.microsoft.com/en-us\"}</p><p><br></p><p><strong>Response Attributes:</strong></p><p>country</p><p>Country of company's headquarter.</p><p><br></p><p>currency</p><p>Currency used in company filings.</p><p><br></p><p>exchange</p><p>Listed exchange.</p><p><br></p><p>finnhubIndustry</p><p>Finnhub industry classification.</p><p><br></p><p>ipo</p><p>IPO date.</p><p><br></p><p>logo</p><p>Logo image.</p><p><br></p><p>marketCapitalization</p><p>Market Capitalization.</p><p><br></p><p>name</p><p>Company name.</p><p><br></p><p>phone</p><p>Company phone number.</p><p><br></p><p>shareOutstanding</p><p>Number of oustanding shares.</p><p><br></p><p>ticker</p><p>Company symbol/ticker as used on the listed exchange.</p><p><br></p><p>weburl</p><p>Company website.</p><p><br></p><p>Reference: https://finnhub.io/docs/api/company-profile2</p><p><br></p><p><br></p><p><br></p><h4>IFinnhubRepository.GetStocks():</h4><p><br></p><p>The returned data from IFinnhubRepository.GetStocks() looks like this:</p><p>[ {\"currency\":\"USD\",\"description\":\"NORTECH SYSTEMS INC\",\"displaySymbol\":\"NSYS\",\"figi\":\"BBG000BFV339\",\"isin\":null,\"mic\":\"XNAS\",\"shareClassFIGI\":\"BBG001S6XGN6\",\"symbol\":\"NSYS\",\"symbol2\":\"\",\"type\":\"Common Stock\"}, ... ]</p><p><br></p><p><strong>Response Attributes:</strong></p><p>currency</p><p>Price's currency. This might be different from the reporting currency of fundamental data.</p><p><br></p><p>description</p><p>Symbol description</p><p><br></p><p>displaySymbol</p><p>Display symbol name.</p><p><br></p><p>figi</p><p>FIGI identifier.</p><p><br></p><p>isin</p><p>ISIN. This field is only available for EU stocks and selected Asian markets. Entitlement from Finnhub is required to access this field.</p><p><br></p><p>mic</p><p>Primary exchange's MIC.</p><p><br></p><p>shareClassFIGI</p><p>Global Share Class FIGI.</p><p><br></p><p>symbol</p><p>Unique symbol used to identify this symbol used in /stock/candle endpoint.</p><p><br></p><p>symbol2</p><p>Alternative ticker for exchanges with multiple tickers for 1 stock such as BSE.</p><p><br></p><p>type</p><p>Security type.</p><p><br></p><p><br></p><p>Reference: https://finnhub.io/docs/api/stock-symbols</p><p><br></p><p><br></p><p><br></p><h4>IFinnhubRepository.SearchStocks():</h4><p><br></p><p>The returned data from IFinnhubRepository.SearchStocks() looks like this:</p><p>{\"count\":32,\"result\":[{\"description\":\"APPLE INC\",\"displaySymbol\":\"AAPL\",\"symbol\":\"AAPL\",\"type\":\"Common Stock\"}, ... ] }</p><p><br></p><p><strong>Response Attributes:</strong></p><p>count</p><p>Number of results.</p><p><br></p><p>result</p><p>Array of search results.</p><p><br></p><p>description</p><p>Symbol description</p><p><br></p><p>displaySymbol</p><p>Display symbol name.</p><p><br></p><p>symbol</p><p>Unique symbol used to identify this symbol used in /stock/candle endpoint.</p><p><br></p><p>type</p><p>Security type.</p><p><br></p><p><br></p><p>Reference: https://finnhub.io/docs/api/symbol-search</p><p><br></p><p><br></p><p><br></p><h4>StocksRepository:</h4><p>Create a repository interface called '<strong>IStocksRepository</strong>' with following methods:</p><p>Task&lt;BuyOrder&gt; CreateBuyOrder(BuyOrder buyOrder);</p><p>Task&lt;SellOrder&gt; CreateSellOrder(SellOrder sellOrder);</p><p>Task&lt;List&lt;BuyOrder&gt;&gt; GetBuyOrders();</p><p>Task&lt;List&lt;SellOrder&gt;&gt; GetSellOrders();</p><p><br></p><p>Implement the above repository interface called 'IStocksRepository' that performs the specified operation.</p><p><strong>CreateBuyOrder</strong>: Inserts a new buy order into the database table called 'BuyOrders'.</p><p><strong>CreateSellOrder</strong>: Inserts a new sell order into the database table called 'SellOrders'.</p><p><strong>GetBuyOrders</strong>: Returns the existing list of buy orders retrieved from database table called 'BuyOrders'.</p><p><strong>GetSellOrders</strong>: Returns the existing list of sell orders retrieved from database table called 'SellOrders'.</p><p><br></p><p><br></p><p><br></p><p><br></p><h4>FinnhubService:</h4><p><br></p><p>Create a service interface called '<strong>IFinnhubService</strong>' with following methods:</p><p>Dictionary&lt;string, object&gt;? GetCompanyProfile(string stockSymbol);</p><p>Dictionary&lt;string, object&gt;? GetStockPriceQuote(string stockSymbol);</p><p>Task&lt;List&lt;Dictionary&lt;string, string&gt;&gt;?&gt; GetStocks();</p><p>Task&lt;Dictionary&lt;string, object&gt;?&gt; SearchStocks(string stockSymbolToSearch);</p><p><br></p><p>Implement the above service interface called 'IFinnhubService'; and each method invokes corresponding repository method as mentioned below.</p><p><strong>GetCompanyProfile</strong>: Invokes FinnhubRepository.GetCompanyProfile() and returns the same returned value.</p><p><strong>GetStockPriceQuote</strong>: Invokes FinnhubRepository.GetStockPriceQuote() and returns the same returned value.</p><p><strong>GetStocks</strong>: Invokes FinnhubRepository.GetStocks() and returns the same returned value.</p><p><strong>SearchStocks</strong>: Invokes FinnhubRepository.SearchStocks() and returns the same returned value.</p><p><br></p><p><br></p><p>The service methods such as GetCompanyProfile(), GetStockPriceQuote(), GetStocks() and SearchStocks()&nbsp; return the same response data that was actually returned by the corresponding repository method.</p><p><br></p><p><br></p><p><br></p><h4>StocksService:</h4><p>Create a service interface called '<strong>IStocksService</strong>' with following methods:</p><p>Task&lt;BuyOrder&gt; CreateBuyOrder(BuyOrder buyOrder);</p><p>Task&lt;SellOrdere&gt; CreateSellOrder(SellOrder sellOrder);</p><p>Task&lt;List&lt;BuyOrder&gt;&gt; GetBuyOrders();</p><p>Task&lt;List&lt;SellOrder&gt;&gt; GetSellOrders();</p><p><br></p><p>Implement the above service interface called 'IStocksService' that performs the specified operation.</p><p><strong>CreateBuyOrder</strong>: Invokes the StocksRepository.CreateBuyOrder() and returns the same returned value.</p><p><strong>CreateSellOrder</strong>: Invokes the StocksRepository.CreateSellOrder() and returns the same returned value.</p><p><strong>GetBuyOrders</strong>: Invokes the StocksRepository.GetBuyOrders() and returns the same returned value.</p><p><strong>GetSellOrders</strong>: Invokes the StocksRepository.GetSellOrders() and returns the same returned value.</p><p><br></p><p><br></p><p><br></p><h4>StockTrade:</h4><p>You need to create three view model classes called \"<strong>StockTrade</strong>\", \"<strong>Stock</strong>\" and \"<strong>Orders</strong>\".</p><p>Create a view model class called \"StockTrade\" in the Asp.Net Core project with following properties:</p><p>string? StockSymbol</p><p>string? StockName</p><p>double Price</p><p>unit Quantity</p><p><br></p><p>This class will be used to send model object from controller to the \"Trade/Index\" view.</p><p><br></p><p><br></p><h4>Stock:</h4><p>Create a view model class called \"Stocke\" in the Asp.Net Core project with following properties:</p><p>string? StockSymbol</p><p>string? StockName</p><p><br></p><p>This class will be used to send model object from controller to the \"Stocks/Explore\" view.</p><p><br></p><p><br></p><h4>Orders:</h4><p>Create a view model class called \"Orders\" in the Asp.Net Core project with following properties:</p><ul><li><p>List&lt;BuyOrderResponse&gt; BuyOrders</p></li><li><p>List&lt;SellOrderResponse&gt; SellOrders</p></li></ul><p><br></p><p>This class will be used to send list of buy orders and sell orders - from controller to the \"Trade/Orders\" view.</p><p><br></p><p><br></p><p><br></p><h4>\"Trade\\Index.cshtml\":</h4><p>You need to create four views called \"Trade\\Index.cshtml\", \"Stocks\\Explore.cshtml\", \"Trade\\Orders.cshtml\" and \"Trade\\OrdersPDF.cshtml\".</p><p><br></p><p>Create a view called \"Index.cshtml\" in \"Views\\Trade\" folder - that is strongly typed to the view model class called \"StockTrade\". So it receives the model object of \"StockTrade\" type and displays the stock name and its price as shown in below screenshot.</p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-11-04_18-07-10-cb74ebd4780304ac9eadb634e72fc74a.png\"></figure><p><br></p><p>The view should store the stock symbol (Eg: MSFT) as a hidden element. So that, it can be accessible in the javascript code, while connecting finnhub websocket.</p><p>So, you need to write javascript code to connect to finnhub websocket at `<strong>wss://ws.finnhub.io?token=${token}</strong>` url. On receiving each message from the socket, you need update the latest stock price in the UI.</p><p>The response from finnhub websocket looks like this:</p><p>&nbsp; &nbsp;{\"data\":[{\"p\":220.89,\"s\":\"MSFT\",\"t\":1575526691134,\"v\":100}, {\"p\":220.82,\"s\":\"MSFT\",\"t\":1575526691167,\"v\":15}],\"type\":\"trade\"}</p><p><br></p><p><strong>&nbsp;Response attributes:</strong></p><p>&nbsp; &nbsp; type: message type</p><p>&nbsp; &nbsp; data: [ list of trades ]</p><p>&nbsp; &nbsp; s: symbol of the company</p><p>&nbsp; &nbsp; p: Last price</p><p>&nbsp; &nbsp; t: UNIX milliseconds timestamp</p><p>&nbsp; &nbsp; v: volume (number of orders)</p><p>&nbsp; &nbsp; c: trade conditions (if any)</p><p><br></p><p>You can see more than one element in the 'data' array in the above response example. But in the output, we need to display only one. You can display either of the prices (or) the highest price in the output.</p><p><br></p><p>When the page is closed, you must unsubscribe from the finnhub websocket to avoid any memory leaks.</p><p><br></p><p>Overall, your application should refresh the updated price of the stock for every one or two seconds as long as the page runs (of course, only when the market is LIVE i.e. usually 09:30 a.m. to 4 p.m. (ET)).</p><p><br></p><p>When the user clicks on the \"Buy\" button, the browser should make a HTTP POST request to \"Trade/BuyOrder\" with values of \"StockSymbol\", \"StockName\", \"Quantity\" and \"Price\". You can submit values that are not to be directly displayed, through input type=\"hidden\" fields also.</p><p><br></p><p>When the user clicks on the \"Sell\" button, the browser should make a HTTP POST request to \"Trade/SellOrder\" with values of \"StockSymbol\", \"StockName\", \"Quantity\" and \"Price\". You can submit values that are not to be directly displayed, through input type=\"hidden\" fields also.</p><p><br></p><p><br></p><h4>\"Trade\\Orders.cshtml\":</h4><p>Create a view called \"Orders.cshtml\" in \"Views\\Trade\" folder - that is strongly typed to the view model class called \"Orders\". So it receives the model object of \"Orders\" type from controller and displays the list of both buy orders and sell orders as shown in the below screenshot.</p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-11-04_18-07-10-b780d7938fd8c3f94eaa6a14fb01603f.png\"></figure><p><br></p><h4>\"Trade\\OrdersPDF.cshtml\":</h4><p>Create a view called \"OrdersPDF.cshtml\" in \"Views\\Trade\" folder - that is strongly typed view bound to list of orders. So it receives list of both BuyOrder and SellOrder from controller &amp; displays the list or orders in printable format as shown in the below screenshot.</p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-11-04_18-07-10-134c70d02701e024858d5e436dd63fa1.png\"></figure><p><br></p><h4>\"Stocks\\Explore.cshtml\":</h4><p>Create a view called \"Explore.cshtml\" in \"Views\\Stocks\" folder - that is strongly typed to the view model class of type \"List&lt;Stock&gt;\". So it receives a list of model objects of \"Stock\" type from controller and displays the list of available stocks as shown in the below screenshot.</p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-11-04_18-07-10-4088e22f2c5b37b6ae5d0c533fe3c204.png\"></figure><p><br></p><p>When the user clicks on a specific stock, it should invoke a ViewComponent called \"SelectedStockViewComponent\" and that should display the selected stock details such as stock name, stock symbol, stock image, price etc., along with same list of availble stocks as mentioned in the below screenshot.</p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-11-04_18-07-10-8b82d4b258a09f780152312818e7a1d8.png\"></figure><p><br></p><p><br></p><p><br></p><h4>Trade Controller:</h4><p>Create a controller called TradeController that has five action methods called \"<strong>Index</strong>()\", \"<strong>BuyOrder</strong>()\" and \"<strong>SellOrder</strong>()\", \"<strong>Orders</strong>()\" and \"<strong>OrdersPDF</strong>()\".</p><p>The controller has to inject the appsettings called \"TradingOptions\" (from appsettings.json), IFinnhubService, IStocksService.</p><p><br></p><p><br></p><h4>TradeController.Index():</h4><p>- It receives HTTP GET request at route \"Trade/Index\".</p><p>- It first gets the \"TradingOptions\" from appsettings.json using Options pattern.</p><p><br></p><p>- The Index() action method invokes the following methods:</p><ol><li><p>FinnhubService.GetCompanyProfile() to fetch stock name, stock symbol and other details.</p></li><li><p>FinnhubService.GetStockPriceQuote() to fetch current stock price.</p></li></ol><p><br></p><p>- And then it creates an object of \"StockTrade\" model class and fills essential data such as StockSymbol, StockName, Price and Quantity that are read from the return values of above mentioned service methods i.e. \"FinnhubService.GetCompanyProfile()\" and \"FinnhubService.GetStockPriceQuote()\".</p><p>- Then it sends the same model object to the view.</p><p><br></p><p><br></p><h4>TradeController.BuyOrder():</h4><ul><li><p>It receives HTTP POST request at route \"Trade/BuyOrder\".</p></li><li><p>It receives the model object of \"BuyOrder\" type through model binding.</p></li><li><p>It initializes \"DateAndTimeOfOrder\" into the model object (i.e. buyOrder).</p></li><li><p>If model state has no errors, it invokes StocksService.CreateBuyOrder() method. Then it redirects to \"Trade/Orders\" route to display list of orders.</p></li><li><p>Alternatively, in case of validation errors in the model object, it reinvokes the same view, along with same model object.</p></li></ul><p><br></p><p><br></p><h4>TradeController.SellOrder():</h4><ul><li><p>It receives HTTP POST request at route \"Trade/SellOrder\".</p></li><li><p>It receives the model object of \"SellOrder\" type through model binding.</p></li><li><p>It initializes \"DateAndTimeOfOrder\" into the model object (i.e. sellOrder).</p></li><li><p>If model state has no errors, it invokes StocksService.CreateSellOrder() method. Then it redirects to \"Trade/Orders\" route to display list of orders.</p></li><li><p>Alternatively, in case of validation errors in the model object, it reinvokes the same view, along with same model object.</p></li></ul><p><br></p><p><br></p><h4>TradeController.Orders():</h4><ul><li><p>It receives HTTP GET request at route \"Trade/Orders\".</p></li><li><p>It invokes both the service methods StocksService.GetBuyOrders() and StocksService.GetSellOrders().</p></li><li><p>Then it creates an object of the view model class called 'Orders' and initializes both 'BuyOrders' and 'SellOrders' properties with the data returned by the above called service methods.</p></li><li><p>It invokes the \"Trade/Orders\" view to display list of orders.</p></li></ul><p><br></p><p><br></p><h4>TradeController.OrdersPDF():</h4><ul><li><p>It receives HTTP GET request at route \"Trade/OrdersPDF\".</p></li><li><p>It invokes both the service methods StocksService.GetBuyOrders() and StocksService.GetSellOrders().</p></li><li><p>It invokes the \"Trade/OrdersPDF\" view and renders it as PDF file using 'Rotativa' package.</p></li></ul><p><br></p><p><br></p><p><br></p><h4>Stocks Controller:</h4><p>Create a controller called StocksController that has an action method called \"Explore()\".</p><p>The controller has to inject the appsettings called \"TradingOptions\" (from appsettings.json), IFinnhubService, IStocksService.</p><p><br></p><p><br></p><h4>StocksController.Explore():</h4><ul><li><p>It receives HTTP GET request at route \"Stocks/Explore\".</p></li><li><p>The Explore() action method invokes the FinnhubService.GetStocks() to fetch list of all available stocks in the market.</p></li><li><p>And then it filters out unnecessary stocks from the list but keeps only the stocks in \"Top25PopularStocks\".&nbsp;</p></li><li><p>It sends the filtered stocks (only top 25 stocks) to the view as List&lt;Stock&gt;.</p></li><li><p>It has a route parameter called \"stock\". It sends the same stock (stock symbol) to the view through ViewBag. So that, the view can invoke a view component called \"SelectedStock\" to display selected stock details at right hand side as shown in the screenshot of \"Stocks/Explore\" view.</p></li></ul><p><br></p><p><br></p><p><br></p><h4>xUnit Test cases:</h4><p>Write the following unit test cases for testing respective service methods. Use Fluent assertions, Auto fixture, Moq as per the necessity. You need to mock the repositories.</p><p><br></p><p><strong>StocksService.CreateBuyOrder():</strong></p><p>1. When you supply BuyOrderRequest as null, it should throw ArgumentNullException.</p><p>2. When you supply buyOrderQuantity as 0 (as per the specification, minimum is 1), it should throw ArgumentException.</p><p>3. When you supply buyOrderQuantity as 100001 (as per the specification, maximum is 100000), it should throw ArgumentException.</p><p>4. When you supply buyOrderPrice as 0 (as per the specification, minimum is 1), it should throw ArgumentException.</p><p>5. When you supply buyOrderPrice as 10001 (as per the specification, maximum is 10000), it should throw ArgumentException.</p><p>6. When you supply stock symbol=null (as per the specification, stock symbol can't be null), it should throw ArgumentException.</p><p>7. When you supply dateAndTimeOfOrder as \"1999-12-31\" (YYYY-MM-DD) - (as per the specification, it should be equal or newer date than 2000-01-01), it should throw ArgumentException.</p><p>8. If you supply all valid values, it should be successful and return an object of BuyOrderResponse type with auto-generated BuyOrderID (guid).</p><p><br></p><p><strong>StocksService.CreateSellOrder():</strong></p><p>1. When you supply SellOrderRequest as null, it should throw ArgumentNullException.</p><p>2. When you supply sellOrderQuantity as 0 (as per the specification, minimum is 1), it should throw ArgumentException.</p><p>3. When you supply sellOrderQuantity as 100001 (as per the specification, maximum is 100000), it should throw ArgumentException.</p><p>4. When you supply sellOrderPrice as 0 (as per the specification, minimum is 1), it should throw ArgumentException.</p><p>5. When you supply sellOrderPrice as 10001 (as per the specification, maximum is 10000), it should throw ArgumentException.</p><p>6. When you supply stock symbol=null (as per the specification, stock symbol can't be null), it should throw ArgumentException.</p><p>7. When you supply dateAndTimeOfOrder as \"1999-12-31\" (YYYY-MM-DD) - (as per the specification, it should be equal or newer date than 2000-01-01), it should throw ArgumentException.</p><p>8. If you supply all valid values, it should be successful and return an object of SellOrderResponse type with auto-generated SellOrderID (guid).</p><p><br></p><p><br></p><p><strong>StocksService.GetAllBuyOrders():</strong></p><p>1. When you invoke this method, by default, the returned list should be empty.</p><p>2. When you first add few buy orders using CreateBuyOrder() method; and then invoke GetAllBuyOrders() method; the returned list should contain all the same buy orders.</p><p><br></p><p><br></p><p><strong>StocksService.GetAllSellOrders():</strong></p><p>1. When you invoke this method, by default, the returned list should be empty.</p><p>2. When you first add few sell orders using CreateSellOrder() method; and then invoke GetAllSellOrders() method; the returned list should contain all the same sell orders.</p><p><br></p><p><br></p><p><br></p><h4>xUnit Controller Test cases:</h4><p>Write the following unit test cases for testing respective controller action methods. You need to mock the services.</p><p><br></p><p><strong>StocksController.Explore():</strong></p><p>1. When you supply null to \"stock\" parameter, it should return \"Explore\" view along with List&lt;Stock&gt; as model object.</p><p><br></p><p><br></p><p><br></p><h4>xUnit Integration Test cases:</h4><p>Write the following integration test cases for testing respective routes.</p><p><br></p><p><strong>\"/Trade/Index/MSFT\":</strong></p><p>When you make a HTTP GET request to the \"Trade/Index/MSFT\" route, it should return a view result (html response) with an HTML element that has class=\"price\".</p><p><br></p><p><br></p><p><br></p><h4>Instructions:</h4><blockquote><ol><li><p>Create controller(s) with attribute routing.</p></li><li><p>Provide the configuration as service, using Options pattern.</p></li><li><p>Inject the IOptions in the controller.</p></li><li><p>Use CSS styles, layout views, _ViewImports, _ViewStart as per the necessity.</p></li><li><p>The CSS file is provided as downlodable resource for applying essential styles. You can download and use it.</p></li><li><p>Inject essential services such as IFinnhubCompanyProfileService and other services in Controller. Invoke IStocksRepository and IFinnhubRepository in respective service classes.</p></li><li><p>Invoke essential service methods in controller.</p></li><li><p>The Entity model class (BuyOrder and SellOrder) should not be accessed in the controller. They must be used only in the service classes.</p></li><li><p>The DTO model classes (BuyOrderRequest, BuyOrderResponse, SellOrderRequest, SellOrderResponse) should be used as parameter type or return type in the service methods; and can be used in both services and controller.</p></li><li><p>Use appropriate tag helpers such as \"asp-controller\", \"asp-action\", \"asp-for\" etc., in all views wherever necessary.</p></li></ol></blockquote><p><br></p><p><br></p><h4>Changes from previous assignment:</h4><ul><li><p>The \"Trade/Explore\" view shows all popular stock prices and the user can click on any one stock to see the price chart of the selected stock in \"Trade/Index\" view. In the same page, if the user clicks on a specific stock, it should display the selected stock name, image, price along with \"Trade Now\" button.</p></li><li><p>When the user clicks on \"Trade Now\" button, it should redirect to \"Trade/Index\" view that shows the price chart along with \"Sell\" and \"Buy\" buttons as developed already.</p></li></ul><p><br></p>","asset":null,"display_type":"text"}]},"solution_res":{"count":0,"next":null,"previous":null,"results":[]},"instructor_example_res":{"count":1,"next":null,"previous":null,"results":[{"_class":"practice_question","id":507288,"body":"<p>Check your source code with Instructor's source code.</p>","answer":"<p>Full sourc
