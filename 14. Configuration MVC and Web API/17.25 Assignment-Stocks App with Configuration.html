    <script>
      classInfo = {"first_res":{"_class":"practice","id":1441432,"is_free":false,"description":"Create an Asp.Net Core Web Application that displays stock price with live updates from \"https://finnhub.io/\".","estimated_duration":60,"num_submissions":135},"instruction_res":{"count":2,"next":null,"previous":null,"results":[{"_class":"practice_component","id":425492,"body":"","asset":{"_class":"asset","id":46800002,"asset_type":"File","title":"StyleSheet.css","created":"2023-02-13T14:23:09Z","status":1,"captions":[],"body":"","external_url":"","is_external":false,"filename":"StyleSheet.css","media_license_token":null,"media_sources":[],"course_is_drmed":false,"download_urls":{"File":[{"label":"download","file":"https://att-c.udemycdn.com/2023-02-13_14-23-09-c0aed160ff7042a19fec4240602aae7f/original.css?response-content-disposition=attachment%3B+filename%3DStyleSheet.css&Expires=1755961305&Signature=cUQWdOZUs4g~CagD4gFd1YjRkKgwTsuFavz~4-4YXKK7bD1mHqyKsZcO6BktW1jqtASUBouZZF6q-wV02XUc7QGs3wPvBC6XnHUOFmyPPKzypApdNZbTljMPeUbHO52OS4sP3ypHCZxM5Y6dChU4dWopOf5XNCztwJyIJE6T6FIOe5r98j5RjrE0jUPaAXVcEvp2wwoG-T5YqAdn9Tlab4lClzRnClC2AvkPmR0wbssBLT~nMPRrQqq~4BH26Yc0hVzVMdfbbXGngWUIPnBrgeYsjzuyrdpvpZutBWWt6-mRPzMD-Wi~AAXqO8sRrMDji6JW5WJJY5E6KjSjE9d51A__&Key-Pair-Id=K3MG148K9RIRF4"}]},"slide_urls":[],"slides":[],"stream_urls":null,"processing_errors":[]},"display_type":"download"},{"_class":"practice_component","id":425488,"body":"<h4>Requirement</h4><p>Create an Asp.Net Core Web Application that displays stock price with live updates from \"<strong>https://finnhub.io/</strong>\".</p><p><br></p><p><br></p><h4>UI&nbsp;Design</h4><p><strong>Trade/Index:</strong></p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2023-02-13_14-01-41-c83b87e1d1b84572fd2ebfb598c84c75.png\"></figure><p><br></p><p><br></p><p><br></p><h4>Architecture</h4><p>Use the n-layer (also known as n-tier)&nbsp;architecture as shown below.</p><figure><img height=\"387\" src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2022-12-20_15-10-41-9f75748fc30f6231fbfc016b01e0296b.png\" width=\"791\"></figure><p><br></p><p><br></p><h4>Finnhub.io:</h4><p>https://finnhub.io is a service provider that provides live stock price information online.</p><p><br></p><h4>User-Secrets:</h4><ul><li><p>Register in \"<strong>https://finnhub.io/login</strong>\" to generate your own token [or] use the token \"<strong>cc676uaad3i9rj8tb1s0</strong>\" to make requests.</p></li><li><p>After registration at finnhub, you can find your API Key (token) at \"https://finnhub.io/dashboard\".</p></li><li><p>You need to store this token in user-secrets on your machine.</p></li><li><p>You need to attach the token as a part of request url while making requests to \"finnhub.io\".</p></li></ul><p><br></p><p><br></p><h4>appsettings:</h4><p>You will store the following configuration in appsettings.json:</p><pre class=\"prettyprint linenums\">  \"TradingOptions\":\n  {\n    \"DefaultStockSymbol\": \"MSFT\"\n  }</pre><p><br></p><ul><li><p>The \"DefaultStockSymbol\" acts as a default stock to fetch details and display stock price.</p></li></ul><p><br></p><p><br></p><h4>FinnhubService:</h4><p><br></p><p>Create a service interface called '<strong>IFinnhubService</strong>' with following methods:</p><p>Task&lt;Dictionary&lt;string, object&gt;?&gt; GetCompanyProfile(string stockSymbol);</p><p>Task&lt;Dictionary&lt;string, object&gt;?&gt; GetStockPriceQuote(string stockSymbol);</p><p><br></p><p>Implement the above service interface called '<strong>IFinnhubService</strong>' that sends request to the respective url and returns its response as a Dictionary&lt;string, object&gt;.</p><p>GetCompanyProfile: https://finnhub.io/api/v1/stock/profile2?symbol={symbol}&amp;token={token}</p><p>GetStockPriceQuote: https://finnhub.io/api/v1/quote?symbol={symbol}&amp;token={token}</p><p><br></p><p>The service methods such as GetCompanyProfile() and GetStockPriceQuote() return the response data that was actually returned by finnhub.io/api.</p><p><br></p><p><br></p><h4>IFinnhubService.GetStockPriceQuote():</h4><p>The returned data from IFinnhubServiceGetStockPriceQuote() looks like this:</p><p>{\"c\":235.87,\"d\":9.12,\"dp\":4.0221,\"h\":236.6,\"l\":226.06,\"o\":226.24,\"pc\":226.75,\"t\":1666987204}</p><p><br></p><p><strong>Response Attributes:</strong></p><p>c</p><p>Current price</p><p><br></p><p>d</p><p>Change</p><p><br></p><p>dp</p><p>Percent change</p><p><br></p><p>h</p><p>High price of the day</p><p><br></p><p>l</p><p>Low price of the day</p><p><br></p><p>o</p><p>Open price of the day</p><p><br></p><p>pc</p><p>Previous close price</p><p><br></p><p><br></p><p>Reference: https://finnhub.io/docs/api/quote</p><p><br></p><p><br></p><h4>IFinnhubService.GetCompanyProfile():</h4><p>The returned data from IFinnhubService.GetCompanyProfile() looks like this:</p><p>{\"country\":\"US\",\"currency\":\"USD\",\"exchange\":\"NASDAQ NMS - GLOBAL MARKET\",\"finnhubIndustry\":\"Technology\",\"ipo\":\"1986-03-13\",\"logo\":\"https://static2.finnhub.io/file/publicdatany/finnhubimage/stock_logo/MSFT.svg\",\"marketCapitalization\":1758286.5806001066,\"name\":\"Microsoft Corp\",\"phone\":\"14258828080.0\",\"shareOutstanding\":7454.47,\"ticker\":\"MSFT\",\"weburl\":\"https://www.microsoft.com/en-us\"}</p><p><br></p><p><strong>Response Attributes:</strong></p><p>country</p><p>Country of company's headquarter.</p><p><br></p><p>currency</p><p>Currency used in company filings.</p><p><br></p><p>exchange</p><p>Listed exchange.</p><p><br></p><p>finnhubIndustry</p><p>Finnhub industry classification.</p><p><br></p><p>ipo</p><p>IPO date.</p><p><br></p><p>logo</p><p>Logo image.</p><p><br></p><p>marketCapitalization</p><p>Market Capitalization.</p><p><br></p><p>name</p><p>Company name.</p><p><br></p><p>phone</p><p>Company phone number.</p><p><br></p><p>shareOutstanding</p><p>Number of oustanding shares.</p><p><br></p><p>ticker</p><p>Company symbol/ticker as used on the listed exchange.</p><p><br></p><p>weburl</p><p>Company website.</p><p><br></p><p>Reference: https://finnhub.io/docs/api/company-profile2</p><p><br></p><p><br></p><p><br></p><p><br></p><h4>StockTrade:</h4><p>You need to create a view model class called \"<strong>StockTrade</strong>\".</p><p>Create a view model class called \"StockTrade\" in the Asp.Net Core project with following properties:</p><p>string? StockSymbol</p><p>string? StockName</p><p>double Price</p><p>unit Quantity</p><p><br></p><p>This class will be used to send model object from controller to the \"Trade/Index\" view.</p><p><br></p><p><br></p><p><br></p><h4>\"Trade\\Index.cshtml\":</h4><p>You need to create a view called \"Trade\\Index.cshtml\".</p><p><br></p><p>Create a view called \"Index.cshtml\" in \"Views\\Trade\" folder - that is strongly typed to the view model class called \"StockTrade\". So it receives the model object of \"StockTrade\" type and displays the stock name and its price as shown in below screenshot.</p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2023-02-13_14-13-41-f3d3d4f165879e57c0bcc698977ed7b5.png\"></figure><p><br></p><p>The view should store the stock symbol (Eg: MSFT) as a hidden element. So that, it can be accessible in the javascript code, while connecting finnhub websocket.</p><p>So, you need to write javascript code to connect to finnhub websocket at `<strong>wss://ws.finnhub.io?token=${token}</strong>` url. On receiving each message from the socket, you need update the latest stock price in the UI.</p><p>The response from finnhub websocket looks like this:</p><p>&nbsp; &nbsp;{\"data\":[{\"p\":220.89,\"s\":\"MSFT\",\"t\":1575526691134,\"v\":100}, {\"p\":220.82,\"s\":\"MSFT\",\"t\":1575526691167,\"v\":15}],\"type\":\"trade\"}</p><p><br></p><p><strong>&nbsp;Response attributes:</strong></p><p>&nbsp; &nbsp; type: message type</p><p>&nbsp; &nbsp; data: [ list of trades ]</p><p>&nbsp; &nbsp; s: symbol of the company</p><p>&nbsp; &nbsp; p: Last price</p><p>&nbsp; &nbsp; t: UNIX milliseconds timestamp</p><p>&nbsp; &nbsp; v: volume (number of orders)</p><p>&nbsp; &nbsp; c: trade conditions (if any)</p><p><br></p><p>You can see more than one element in the 'data' array in the above response example. But in the output, we need to display only one. You can display either of the prices (or) the highest price in the output.</p><p><br></p><p>When the page is closed, you must unsubscribe from the finnhub websocket to avoid any memory leaks.</p><p><br></p><p>Overall, your application should refresh the updated price of the stock for every one or two seconds as long as the page runs (of course, only when the market is LIVE i.e. usually 09:30 a.m. to 4 p.m. (ET)).</p><p><br></p><p><br></p><p><br></p><h4>Trade Controller:</h4><p>Create a controller called TradeController that has five action methods called \"<strong>Index</strong>()\".</p><p>The controller has to inject the appsettings called \"TradingOptions\" (from appsettings.json) and IFinnhubService.</p><p><br></p><p><br></p><h4>TradeController.Index():</h4><p>- It receives HTTP GET request at route \"Trade/Index\".</p><p>- It first gets the \"TradingOptions\" from appsettings.json using Options pattern.</p><p><br></p><p>- The Index() action method invokes the following methods:</p><ol><li><p>FinnhubCompanyProfileService.GetCompanyProfile() to fetch stock name, stock symbol and other details.</p></li><li><p>FinnhubStockPriceQuoteService.GetStockPriceQuote() to fetch current stock price.</p></li></ol><p><br></p><p>- And then it creates an object of \"StockTrade\" model class and fills essential data such as StockSymbol, StockName, Price and Quantity that are read from the return values of above mentioned service methods i.e. \"FinnhubService.GetCompanyProfile()\" and \"FinnhubService.GetStockPriceQuote()\".</p><p>- Then it sends the same model object to the view.</p><p><br></p><p><br></p><h4>Instructions:</h4><blockquote><ol><li><p>Create controller(s) with attribute routing.</p></li><li><p>Provide the configuration as service, using Options pattern.</p></li><li><p>Inject the IOptions in the controller.</p></li><li><p>Use CSS styles, layout views, _ViewImports, _ViewStart as per the necessity.</p></li><li><p>The CSS file is provided as downlodable resource for applying essential styles. You can download and use it.</p></li><li><p>Inject IFinnhubService in Controller.</p></li><li><p>Invoke essential service methods in controller.</p></li></ol></blockquote><p><br></p>","asset":null,"display_type":"text"}]},"solution_res":{"count":0,"next":null,"previous":null,"results":[]},"instructor_example_res":{"count":1,"next":null,"previous":null,"results":[{"_class":"practice_question","id":534786,"body":"<p>Check your source code with Instructor's source code.</p>","answer":"<p>Full source code at <a href=\"https://github.com/Harsha-Global/AspNetCore-Harsha/tree/main/Assignment%20Solutions/12.%20Section%2014%20-%20Configuration%20-%20Stocks%20App\" rel=\"noopener noreferrer\" target=\"_blank\">Github</a></p>"}]}};
