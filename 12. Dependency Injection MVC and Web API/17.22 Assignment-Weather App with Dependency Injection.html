\",  TemperatureFahrenheit = 33\nCityUniqueCode = \"NYC\", CityName = \"London\", DateAndTime = \"2030-01-01 3:00\",  TemperatureFahrenheit = 60\nCityUniqueCode = \"PAR\", CityName = \"Paris\", DateAndTime = \"2030-01-01 9:00\",  TemperatureFahrenheit = 82</pre><p><br></p><p>Consider a model class called 'CityWeather' with following properties:</p><pre class=\"prettyprint linenums\"> string CityUniqueCode\n string CityName\n DateTime DateAndTime\n int TemperatureFahrenheit</pre><p><br></p><p><br></p><p><br></p><p><strong>Example #1:</strong></p><p>If you receive a HTTP GET request at path \"/\", it has to generate a view with weather details of all cities with HTTP status code 200.</p><p>Request Url: /</p><p>Request Method: GET</p><p>Response Status Code: 200</p><p>Response body (output): </p><p>View as shown below.</p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2023-02-13_14-43-39-a4c71923002e0a65f9eff441d8a0ef20.png\"></figure><p><br></p><p><strong>Example #2:</strong></p><p>If you receive a HTTP GET request at path \"/weather/{cityCode}\", it has to generate a view with weather details of the selected city s with HTTP status code 200.</p><p>Request Url: /</p><p>Request Method: GET</p><p>Response Status Code: 200</p><p>Response body (output): </p><p>View as shown below.</p><figure><img src=\"https://img-c.udemycdn.com/redactor/raw/assignment/2023-02-13_14-43-40-e19768b17e1bed3aae78b4387efeb524.png\"></figure><p><br></p><p><strong>Instructions:</strong></p><ul><li><p>Create controller(s) with attribute routing.</p></li><li><p>Create a service called \"WeatherService\" that implements the following service contract (interface).</p></li></ul><pre class=\"prettyprint linenums\"> IWeatherService\n    - List&lt;CityWeather&gt; GetWeatherDetails() - Returns a list of CityWeather objects that contains weather details of cities\n    - CityWeather? GetWeatherByCityCode(string CityCode) - Returns an object of CityWeather based on the given city code</pre><p><br></p><ul><li><p>Inject the WeatherService into controller using constructor injection. Call the appropriate service methods in action methods, accordingly.</p></li><li><p>Initialize the hard-coded data as collection of model objects in the service.</p></li><li><p>Use strongly-typed views. Send model object(s) to view.</p></li><li><p>If you supply an invalid city code as route parameter, it should show a page with proper error message, instead of throwing an exception.</p></li><li><p>Use CSS styles, layout views, _ViewImports, _ViewStart, view components as per the necessity.</p></li><li><p>The UI should be consistent and modern. It should minimum look like as shown in the screenshot. Optionally, you can try enhancing it based on your thoughts.</p></li><li><p>You can create a view component that displays weather details of a single city; and invoke the same in \"Index\" view in foreach loop while reading city details.</p></li><li><p>Apply background color for each box, based on the following categories of temperature value. Write essential code in view component, to determine the apppriate css class to apply background color.</p></li></ul><pre class=\"prettyprint linenums\">  Fahrenheit is less than 44 = blue background color\n  Fahrenheit is between 44 and 74 = blue background color\n  Fahrenheit is greater than 74 = blue background color</pre><ul><li><p>The CSS file is provided as downlodable resource for applying essential styles. You can download and use it.</p></li></ul><p><br></p>","asset":null,"display_type":"text"}]},"solution_res":{"count":0,"next":null,"previous":null,"results":[]},"instructor_example_res":{"count":1,"next":null,"previous":null,"results":[{"_class":"practice_question","id":534796,"body":"<p>Check your source code with Instructor's source code.</p>","answer":"<p>Full source code at <a href=\"https://github.com/Harsha-Global/AspNetCore-Harsha/tree/main/Assignment%20Solutions/10.%20Section%2012%20-%20Dependency%20Injection%20-%20We
